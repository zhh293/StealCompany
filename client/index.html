<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CatDesk Remote Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- xterm.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <!-- 应用壳 -->
  <div id="app" class="app-shell">
    <!-- 左侧导航栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">⚡</div>
      </div>
      <div class="sidebar-nav">
        <button class="nav-item active" data-view="chat" title="AI 对话">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="nav-label">对话</span>
        </button>
        <button class="nav-item" data-view="terminal" title="终端">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
          <span class="nav-label">终端</span>
        </button>
        <button class="nav-item" data-view="files" title="文件">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="nav-label">文件</span>
        </button>
        <button class="nav-item" data-view="dashboard" title="状态">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span class="nav-label">状态</span>
        </button>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" id="btnLogout" title="退出登录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- ===== AI 对话视图 ===== -->
      <section class="view view-chat active" id="view-chat">
        <div class="chat-layout">
          <!-- 会话侧栏 -->
          <aside class="chat-sidebar" id="chatSidebar">
            <div class="chat-sidebar-header">
              <h3>会话</h3>
              <button class="btn-icon" id="btnNewChat" title="新建会话">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
            </div>
            <div class="session-list" id="sessionList">
              <!-- 动态填充 -->
            </div>
          </aside>

          <!-- 对话主区域 -->
          <div class="chat-main">
            <div class="chat-header">
              <button class="btn-icon sidebar-toggle" id="btnToggleSidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
              </button>
              <div class="chat-title" id="chatTitle">新对话</div>
              <div class="chat-meta" id="chatMeta"></div>
            </div>

            <div class="messages-container" id="messagesContainer">
              <div class="messages-list" id="messagesList">
                <!-- 欢迎消息 -->
                <div class="welcome-message">
                  <div class="welcome-icon">⚡</div>
                  <h2>CatDesk Remote</h2>
                  <p>输入你的问题，开始远程 AI 对话</p>
                  <div class="welcome-tips">
                    <span class="tip">支持流式输出</span>
                    <span class="tip">代码高亮</span>
                    <span class="tip">会话恢复</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
              <div class="input-toolbar">
                <label class="workdir-selector" title="工作目录">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                  </svg>
                  <select id="workDirSelect"></select>
                </label>
              </div>
              <div class="input-wrapper">
                <textarea id="chatInput" placeholder="输入你的问题... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
                <button class="btn-send" id="btnSend" title="发送 (Enter)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
                <button class="btn-stop hidden" id="btnStop" title="停止生成 (Esc)">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="6" width="12" height="12" rx="2"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== 终端视图 ===== -->
      <section class="view view-terminal" id="view-terminal">
        <div class="terminal-header">
          <div class="terminal-tabs" id="terminalTabs">
            <!-- 动态生成 -->
          </div>
          <button class="btn-icon" id="btnNewTerminal" title="新建终端">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="terminal-container" id="terminalContainer">
          <!-- xterm.js 实例在这里 -->
        </div>
      </section>

      <!-- ===== 文件视图 ===== -->
      <section class="view view-files" id="view-files">
        <div class="files-header">
          <div class="breadcrumb" id="breadcrumb"></div>
          <button class="btn-icon" id="btnRefreshFiles" title="刷新">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
        <div class="files-layout">
          <div class="file-list" id="fileList"></div>
          <div class="file-preview" id="filePreview">
            <div class="preview-placeholder">选择一个文件查看内容</div>
          </div>
        </div>
      </section>

      <!-- ===== 状态面板视图 ===== -->
      <section class="view view-dashboard" id="view-dashboard">
        <div class="dashboard-header">
          <h2>系统状态</h2>
          <button class="btn-icon" id="btnRefreshDashboard" title="刷新">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
        <div class="dashboard-content">
          <div class="stats-grid" id="statsGrid"></div>
          <div class="sessions-panel">
            <h3>活跃会话</h3>
            <div class="dashboard-sessions" id="dashboardSessions"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Toast 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 脚本 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
  <script src="/js/utils/storage.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/files.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
